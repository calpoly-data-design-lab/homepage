<svg xmlns="http://www.w3.org/2000/svg" viewBox="-14 -14 178 178">
  <!-- The mark always sits on a ground that contrasts with it: dark mark on white,
       light mark on black. Follows the browser's color scheme; site.js replaces
       this with the active mode's ground. -->
  <style>
    .bg { fill: #fff } .c { fill: #bfbfbf } .b { fill: #404040 } .d { fill: #000 }
    @media (prefers-color-scheme: dark) { .bg { fill: #000 } .c { fill: #404040 } .b { fill: #d9d9d9 } .d { fill: #fff } }
  </style>
  <rect class="bg" x="-14" y="-14" width="178" height="178"/>
  <circle class="c" cx="75" cy="75" r="75"/>
  <rect class="b" x="25" y="0" width="50" height="150"/>
  <path class="d" d="M75 0 A75 75 0 0 1 75 150 Z"/>
</svg>
