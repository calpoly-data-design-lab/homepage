title: Data Design Lab
description: >-
  Homepage for the Cal Poly San Luis Obispo Data Design Lab.
url: ""
baseurl: ""
lang: en

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

collections:
  pages:
    output: true

# Cloudflare Pages reads _headers from the output root; Jekyll skips
# underscore-prefixed files unless they are listed here.
include:
  - _headers

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - script
  - tmp
  - vendor
  - node_modules

plugins: []
