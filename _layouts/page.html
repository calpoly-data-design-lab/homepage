---
layout: default
---
<section class="page-head" aria-labelledby="page-title">
<div class="motif-strip"><canvas class="motif" data-motif-role="strip" aria-hidden="true"></canvas></div>
<div class="wrap">
<h1 id="page-title" class="display page-title">{{ page.heading | default: page.title }}</h1>
{%- if page.lede %}
<div class="lead-col page-intro"><p class="lede">{{ page.lede }}</p></div>
{%- endif %}
</div>
</section>
<main id="main">
{{ content }}
</main>
